<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Titre","default":"GéoBati"},
    {"id":"tagline","type":"string","label":"Signature","default":"Géomètres bâtisseurs 3.0"},
    {"id":"place","type":"string","label":"Lieu","default":"Douala · Cameroun"},
    {"id":"ground","type":"color","label":"Fond","default":"#043b58"},
    {"id":"accent","type":"color","label":"Accent","default":"#30b0b4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP 3.15.0 local (même version que le site) : le rendu ne dépend pas du réseau. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #043b58;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
